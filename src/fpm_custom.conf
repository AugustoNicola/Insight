; Included by heroku-php-apache2 -F (see Procfile) in the [www] pool.
; Mitigation for CVE-2026-115560 (PHP session upload progress, unpatched as of
; 2026-11-02): disable session upload progress. Set as an admin flag so it
; applies before any request handling and can't be overridden at runtime.
; Remove once Heroku ships a PHP release that fixes the CVE.
php_admin_flag[session.upload_progress.enabled] = off
